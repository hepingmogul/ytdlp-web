services:
  api:
    build:
      context: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      LUODAI_JWT_SECRET: ${LUODAI_JWT_SECRET:-change-me-in-production-please}
      LUODAI_DATA_DIR: /data
      LUODAI_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
